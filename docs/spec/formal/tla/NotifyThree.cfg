\* Notify.tla with three members (safety): the host with one device, "a"
\* with two and "b" with one, so a write reaches two other members and one
\* of them can leave while the write handler is still offering the change.
\* 2 writes (coalescing, but not the daily cap: Notify.cfg reaches that).
SPECIFICATION Spec
CONSTANTS
    Members = {"h", "a", "b"}
    Host = "h"
    TwoDevices = {"a"}
    Window = 3
    DailyCap = 2
    CronEvery = 1
    DayLen = 8
    MaxWrites = 2
    MaxFails = 1
INVARIANTS
    TypeOK
    NT23_NeverOwnWrite
    NT23_NothingForNone
    NT24_DailyCap
    NT24_CountAndKind
    PendingKind
    DeletedOnLeave
    CountsAddUp
PROPERTIES
    NT24_Window
    NoSendAfterLeave
    NeverResubscribed
