\* Same as Autosave.cfg but storage.deleteDocument may throw. This config first
\* found a stale-lastSaved bug (SV-1), now fixed; see README.md.
SPECIFICATION Spec
CONSTANTS
    Titles = {"T1", "T2"}
    N = 3
    MaxEdits = 4
    InitTitle = "T1"
    NoTitle = NoTitle
    DeleteCanFail = TRUE
\* The model ends when the bounded edits are used up and the queue drains.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    SV2_OneInFlight
    SV2_StartInEditOrder
    SV2_FinishInStartOrder
    SV3_SupersededNeverSaved
    SV3_NoRedundantWrite
PROPERTIES
    SV2_StoredNeverBackwards
    SV5_DeleteOnlyAfterSave
    SV5_FailedSaveKeepsOld
    SV1_LeaveFlushes
    SV1_EventuallySaved
