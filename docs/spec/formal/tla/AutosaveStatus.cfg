\* Extra check (not a numbered rule): is "saved" shown only when nothing is
\* pending? This config first found a counterexample, now fixed; see README.md.
SPECIFICATION Spec
CONSTANTS
    Titles = {"T1", "T2"}
    N = 3
    MaxEdits = 4
    InitTitle = "T1"
    NoTitle = NoTitle
CHECK_DEADLOCK FALSE
INVARIANT StatusSavedMeansNothingPending
