\* Notify.tla, liveness (rule NT-24, "nothing held back forever"): every
\* change offered to a subscription is eventually in a push to it, unless the
\* subscription is deleted.  Weak fairness on the clock, the cron, the write
\* handlers' offers and the cron's flushes; a transient failure is retried by
\* a later cron.  Two members with one device each and the cron every 2
\* ticks, so a flush can wait for the next cron after the window ends.
SPECIFICATION Spec
CONSTANTS
    Members = {"h", "a"}
    Host = "h"
    TwoDevices = {}
    Window = 3
    DailyCap = 2
    CronEvery = 2
    DayLen = 8
    MaxWrites = 3
    MaxFails = 1
INVARIANTS
    TypeOK
    CountsAddUp
PROPERTIES
    NT24_EventuallyNotified
