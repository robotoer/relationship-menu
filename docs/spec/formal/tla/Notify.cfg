\* TLC configuration for Notify.tla (rules NT-23, NT-24, NT-56), safety: the
\* host with one device and a member with two, time scaled down (a tick is a
\* cron period, so Window 3 ticks = 15 minutes; a day of 8 ticks allows 3
\* pushes by the window and the cap is 2, so the cap is reached), 3 writes
\* and 1 transient push failure.  NotifyThree.cfg adds a third member;
\* NotifyLiveness.cfg checks NT24_EventuallyNotified.
SPECIFICATION Spec
CONSTANTS
    Members = {"h", "a"}
    Host = "h"
    TwoDevices = {"a"}
    Window = 3
    DailyCap = 2
    CronEvery = 1
    DayLen = 8
    MaxWrites = 3
    MaxFails = 1
INVARIANTS
    TypeOK
    NT23_NeverOwnWrite
    NT23_NothingForNone
    NT24_DailyCap
    NT24_CountAndKind
    PendingKind
    DeletedOnLeave
    CountsAddUp
PROPERTIES
    NT24_Window
    NoSendAfterLeave
    NeverResubscribed
