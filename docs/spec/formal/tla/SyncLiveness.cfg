\* Sync.tla, liveness (rule SY-38): once edits stop, both devices end up with
\* exactly the server's menus. Fewer events than Sync.cfg, so the fairness
\* check stays quick.
SPECIFICATION Spec
CONSTANTS
    MaxEvents = 2
    MaxLost = 1
    MaxOffline = 1
    MaxCopies = 2
    Writers = {"A", "B"}
INVARIANTS
    TypeOK
    NoSilentLoss
PROPERTIES
    SY38_Converges
