# The Wants & Won'ts Worker (server/): it serves the built app and the sync API
# from one Worker (docs/spec/sync.md §12, HO-1 and HO-10; server/README.md).
#
# - Every push and pull request: build the app, then test the Worker and check
#   that each environment bundles.
# - Pull requests from this repository: a preview URL (test database, Stripe
#   test mode), as a new version of the test Worker that doesn't replace it.
# - main: deploy the test environment, and production once the repository
#   variable DEPLOY_PRODUCTION is "true".
# Deploys need the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets;
# without them those jobs skip with a warning.
name: Worker (app + sync API)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy this ref to the test environment"
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            server/yarn.lock
      - name: Build the app (the Worker serves build/)
        run: |
          yarn install --immutable
          yarn build
      - run: yarn install --immutable
        working-directory: server
      - name: Typecheck
        run: yarn typecheck
        working-directory: server
      - name: Test (Vitest in the Workers runtime, then routing through Wrangler)
        run: yarn test
        working-directory: server
      - name: Bundle check (every environment)
        working-directory: server
        run: |
          yarn wrangler deploy --dry-run --env test --outdir "$RUNNER_TEMP/worker-test"
          yarn wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/worker-production"

  preview:
    name: Preview URL
    needs: test
    # Forks don't get secrets, so only branches of this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare token is set
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set; skipping the preview."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            server/yarn.lock
      - name: Build the app
        if: steps.token.outputs.ready == 'true'
        run: |
          yarn install --immutable
          yarn build
      - run: yarn install --immutable
        if: steps.token.outputs.ready == 'true'
        working-directory: server
      # A new version of wantsandwonts-test with its own URL
      # (pr-<number>-wantsandwonts-test.<subdomain>.workers.dev). It shares the test
      # database, and doesn't apply this branch's migrations.
      - name: Upload a preview version
        if: steps.token.outputs.ready == 'true'
        working-directory: server
        run: yarn wrangler versions upload --env test --preview-alias "pr-${{ github.event.pull_request.number }}"

  deploy-test:
    name: Deploy (test environment)
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-sync-test
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare token is set
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            server/yarn.lock
      - name: Build the app
        if: steps.token.outputs.ready == 'true'
        run: |
          yarn install --immutable
          yarn build
      - run: yarn install --immutable
        if: steps.token.outputs.ready == 'true'
        working-directory: server
      - name: Apply D1 migrations (menu-sync-test)
        if: steps.token.outputs.ready == 'true'
        working-directory: server
        run: yarn wrangler d1 migrations apply menu-sync-test --env test --remote
      - name: Deploy the Worker (wantsandwonts-test)
        if: steps.token.outputs.ready == 'true'
        working-directory: server
        run: yarn wrangler deploy --env test

  deploy-production:
    name: Deploy (production)
    needs: [test, deploy-test]
    # Off until the owner sets the repository variable DEPLOY_PRODUCTION to "true"
    # (Settings → Secrets and variables → Actions → Variables) at go-live.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PRODUCTION == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::DEPLOY_PRODUCTION is on, but CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            server/yarn.lock
      - name: Build the app
        run: |
          yarn install --immutable
          yarn build
      - run: yarn install --immutable
        working-directory: server
      - name: Apply D1 migrations (menu-sync-prod)
        working-directory: server
        run: yarn wrangler d1 migrations apply menu-sync-prod --env production --remote
      - name: Deploy the Worker (wantsandwonts)
        working-directory: server
        run: yarn wrangler deploy --env production
