    />

    <!-- Plain-text description of the app and its link format, for AI agents. -->
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relationship Menu" />
    <meta property="og:title" content="Relationship Menu" />

      property="og:description"
      content="Say what you want from a relationship, compare answers with your partner, and see where you match."

    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Relationship Menu</title>
    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      // Menus live in the URL's query string (?encoded=...), answers included, so
      // never report full URLs: no automatic page view, and only the path is sent.
      var analyticsConfig = {
        send_page_view: false,
        page_location: location.origin + location.pathname,
        page_referrer: document.referrer ? document.referrer.split(/[?#]/)[0] : undefined,
      };
      // To watch your own events live in GA's DebugView, run this once in the
      // browser console on the live site: localStorage.analytics_debug = "1"
      try {
        if (localStorage.getItem('analytics_debug') === '1') analyticsConfig.debug_mode = true;
      } catch (e) {}
      gtag('config', 'G-JGP1J62LL4', analyticsConfig);

      // Only production reports. Local runs, Vercel previews, other copies and automated
      // browsers (the e2e tests, in CI and locally) once made up almost all GA "users".
      // Everywhere else events just queue up in window.dataLayer, where the e2e privacy
      // test reads them; nothing is sent.
      if (location.hostname === 'relationship-menu.vercel.app' && !navigator.webdriver) {
        var gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-JGP1J62LL4';
        document.head.appendChild(gtagScript);
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
