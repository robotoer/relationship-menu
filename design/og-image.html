<!doctype html>
<!--
  Source of public/og-image.png, the 1200×630 social preview.
  Render it with `yarn og-image` (design/render-og-image.mjs).
  Uses the app's fonts and Sweetie 16 palette (src/index.css).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wants &amp; Won'ts social preview</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("../node_modules/@fontsource/press-start-2p/files/press-start-2p-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "VT323";
        src: url("../node_modules/@fontsource/vt323/files/vt323-latin-400-normal.woff2") format("woff2");
      }
      :root {
        --c-ink: #1a1c2c;
        --c-plum: #5d275d;
        --c-red: #b13e53;
        --c-yellow: #ffcd75;
        --c-lime: #a7f070;
        --c-green: #38b764;
        --c-blue: #3b5dc9;
        --c-cyan: #73eff7;
        --c-white: #f4f4f4;
        --c-mist: #94b0c2;
        --pixel: "Press Start 2P", monospace;
        --body: "VT323", monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background-color: var(--c-ink);
        background-image: linear-gradient(rgba(148, 176, 194, 0.07) 2px, transparent 2px),
          linear-gradient(90deg, rgba(148, 176, 194, 0.07) 2px, transparent 2px);
        background-size: 40px 40px;
        background-position: -1px -1px;
        color: var(--c-white);
        -webkit-font-smoothing: none;
      }

      .words {
        position: absolute;
        left: 72px;
        top: 96px;
        width: 640px;
      }
      .kicker {
        font-family: var(--pixel);
        font-size: 20px;
        line-height: 1;
        color: var(--c-lime);
        text-transform: uppercase;
      }
      h1 {
        margin-top: 34px;
        font-family: var(--pixel);
        font-weight: normal;
        font-size: 84px;
        line-height: 112px;
        color: var(--c-yellow);
        text-shadow: 6px 6px 0 var(--c-red), 12px 12px 0 var(--c-plum);
      }
      .lead {
        margin-top: 34px;
        font-family: var(--body);
        font-size: 38px;
        line-height: 42px;
      }
      .address {
        margin-top: 26px;
        font-family: var(--pixel);
        font-size: 16px;
        line-height: 1;
        color: var(--c-cyan);
      }

      .card {
        position: absolute;
        left: 730px;
        top: 156px;
        width: 396px;
        padding: 24px 24px 26px;
        background: var(--c-white);
        color: var(--c-ink);
        box-shadow: 18px 18px 0 0 var(--c-plum);
      }
      .heads {
        display: flex;
        gap: 12px;
        font-family: var(--pixel);
        font-size: 14px;
        line-height: 1;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      .heads span {
        width: 52px;
        text-align: center;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-top: 2px dashed var(--c-mist);
      }
      .heads + .row {
        border-top: 0;
        padding-top: 0;
      }
      .row:last-child {
        padding-bottom: 0;
      }
      .sq {
        width: 52px;
        height: 52px;
        border: 4px solid var(--c-ink);
        flex: none;
      }
      .item {
        margin-left: 6px;
        font-family: var(--body);
        font-size: 32px;
        line-height: 1;
        white-space: nowrap;
      }
      .blue {
        background: var(--c-blue);
      }
      .green {
        background: var(--c-green);
      }
      .yellow {
        background: var(--c-yellow);
      }
      .red {
        background: var(--c-red);
      }
    </style>
  </head>
  <body>
    <div class="words">
      <p class="kicker">A relationship menu</p>
      <h1>Wants &amp;<br />Won'ts</h1>
      <p class="lead">Say what you want from a relationship.<br />Compare answers. See where you match.</p>
      <p class="address">wantsandwonts.com</p>
    </div>

    <div class="card" aria-hidden="true">
      <div class="heads"><span>You</span><span>Them</span></div>
      <div class="row">
        <span class="sq blue"></span><span class="sq blue"></span><span class="item">Date nights</span>
      </div>
      <div class="row">
        <span class="sq green"></span><span class="sq yellow"></span><span class="item">Moving in</span>
      </div>
      <div class="row">
        <span class="sq red"></span><span class="sq green"></span><span class="item">Dating others</span>
      </div>
    </div>
  </body>
</html>
