# The Wants & Won'ts Worker: it serves the app (static files) and the supporter
# sync API (/v1/*). See docs/spec/sync.md (§7 API, §12 hosting, §14 costs).
#
# Environments:
#   (none)      local `wrangler dev` and the Vitest suite; Miniflare's local D1.
#   test        Stripe test mode, D1 `menu-sync-test`, a workers.dev URL, and a
#               preview URL for each pull request. Deployed from `main` by
#               .github/workflows/server.yml.
#   production  Stripe live mode, D1 `menu-sync-prod`, wantsandwonts.com.
#               Deployed from `main` once the repository variable
#               DEPLOY_PRODUCTION is "true" (see server/README.md).
#
# The app is built first, at the repository root (`yarn build` → ../build).
#
# Secrets (never in this file): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, and
#   ANTHROPIC_API_KEY for the AI coach (docs/spec/coach.md). The coach stays off
#   until an environment also sets COACH_ENABLED = "true" in its vars.
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT for web push
#   (docs/spec/notifications.md §7b); without them push answers 503 and
#   everything else works. See server/README.md for making the key pair.
#   FCM_SERVICE_ACCOUNT for the store apps' push (Firebase Cloud Messaging,
#   notifications.md §7c): a Google service account's JSON key, stored with
#   `npx wrangler secret put FCM_SERVICE_ACCOUNT --env test < key.json`. Without
#   it FCM subscriptions answer 503 and web push still works. See server/README.md.
#   npx wrangler secret put STRIPE_SECRET_KEY --env test

name = "wantsandwonts-local"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

# SY-44: no per-request invocation logs; the Worker writes one line per error.
[observability]
enabled = true
[observability.logs]
invocation_logs = false

# HO-1: the built app is served as static assets. Requests for them never run
# Worker code, cost nothing and don't count toward the Worker's request limit.
# Only /v1/* runs the Worker (HO-2: the app calls the API on its own address, so
# there are no CORS headers). Any other unknown path gets the app's index.html,
# and the app's router takes over (NV-1). Every environment inherits this.
[assets]
directory = "../build"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

[vars]
APP_ORIGIN = "http://localhost:3099"
MANAGED_PAYMENTS = "true"

[[d1_databases]]
binding = "DB"
database_name = "menu-sync-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# SY-43. Limits are per Cloudflare location and approximate. Locally (and in the
# Vitest suite) the general per-account limit is raised so tests can make many
# writes; the deployed environments below use 60 a minute.
[[ratelimits]]
name = "RL_ACCOUNT"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }

[[ratelimits]]
name = "RL_SENSITIVE"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_IP"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# ---------------------------------------------------------------------------
[env.test]
name = "wantsandwonts-test"
workers_dev = true
# HO-10: each pull request gets its own preview URL (wrangler versions upload
# --preview-alias pr-<number>), against this test database and Stripe test mode.
preview_urls = true

[env.test.observability]
enabled = true
[env.test.observability.logs]
invocation_logs = false

[env.test.vars]
APP_ORIGIN = "http://localhost:3099"
MANAGED_PAYMENTS = "true"

[[env.test.d1_databases]]
binding = "DB"
database_name = "menu-sync-test"
database_id = "f14f5608-e4a9-4272-b136-8a5c928de807"
migrations_dir = "migrations"

[[env.test.ratelimits]]
name = "RL_ACCOUNT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.test.ratelimits]]
name = "RL_SENSITIVE"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[env.test.ratelimits]]
name = "RL_IP"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Daily: the purge (src/cron.ts). Every 5 minutes: notifications held back by
# the 15-minute window or the daily limit (src/notify.ts, notifications.md NT-24).
[env.test.triggers]
crons = ["17 3 * * *", "*/5 * * * *"]

# ---------------------------------------------------------------------------
[env.production]
name = "wantsandwonts"
workers_dev = false
# HO-1: the production address. Cloudflare manages its DNS record and
# certificate as a Workers custom domain (attached on 2026-11-26). wantsandwonts.app
# and www. redirect here with Cloudflare redirect rules (dashboard), not through
# this Worker.
routes = [
  { pattern = "wantsandwonts.com", custom_domain = true },
]

[env.production.observability]
enabled = true
[env.production.observability.logs]
invocation_logs = false

[env.production.vars]
APP_ORIGIN = "https://wantsandwonts.com"
MANAGED_PAYMENTS = "true"

[[env.production.d1_databases]]
binding = "DB"
database_name = "menu-sync-prod"
database_id = "be712c7e-c171-4e5b-b0cd-5a40096c0bed"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "RL_ACCOUNT"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "RL_SENSITIVE"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_IP"
namespace_id = "2003"
simple = { limit = 10, period = 60 }

# As for test: the daily purge, and the 5-minute push flush.
[env.production.triggers]
crons = ["17 3 * * *", "*/5 * * * *"]
